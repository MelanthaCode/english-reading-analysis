<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128" width="128" height="128" role="img" aria-label="English to Chinese reading analysis">
  <defs>
    <clipPath id="tile"><rect width="128" height="128" rx="26"/></clipPath>
  </defs>

  <g clip-path="url(#tile)">
    <!-- 纸色底：左上 -->
    <rect width="128" height="128" fill="#f4efe5"/>

    <!-- 墨色：右下斜切 -->
    <path d="M0 128 128 0v128z" fill="#2f2620"/>

    <!-- 左上反白区：拉丁 -->
    <text x="36" y="58" font-family="Georgia, 'Times New Roman', serif" font-size="40" font-weight="700"
          fill="#2f2620" text-anchor="middle">A</text>

    <!-- 右下墨区：中文（反白） -->
    <text x="90" y="104" font-family="'Songti SC', 'SimSun', 'Noto Serif CJK SC', serif" font-size="36"
          font-weight="600" fill="#f4efe5" text-anchor="middle">文</text>
  </g>
</svg>
